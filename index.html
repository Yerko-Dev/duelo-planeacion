<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duelo de Planeación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una pregunta grande arriba, fichas de equipos debajo; todo legible desde el fondo del salón. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E8EEED; --ink:#0F2A43; --ink-2:#425667; --line:#D3DDDB;
  --accent:#1B7F6A; --accent-ink:#FFFFFF; --accent-soft:#D9EEE8; --warm:#A44E12; --warm-soft:#F9E8DA;
  --focus:#2F6FA8; --shadow:0 1px 0 rgba(15,42,67,.06),0 10px 28px -14px rgba(15,42,67,.28);
  --f-display:'EB Garamond',Georgia,'Times New Roman',serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B2B; --surface:#12283D; --surface-2:#183552; --ink:#EAF1F4; --ink-2:#A9BCCB; --line:#27445E;
    --accent:#4FC4A5; --accent-ink:#06261E; --accent-soft:#13453C; --warm:#F2A468; --warm-soft:#3D2A1B;
    --focus:#7DB6E8; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1B2B; --surface:#12283D; --surface-2:#183552; --ink:#EAF1F4; --ink-2:#A9BCCB; --line:#27445E;
  --accent:#4FC4A5; --accent-ink:#06261E; --accent-soft:#13453C; --warm:#F2A468; --warm-soft:#3D2A1B;
  --focus:#7DB6E8; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:clamp(16px,3vw,40px);padding-block:clamp(16px,2.4vw,32px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 2px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4.4vw,48px);line-height:1.05;margin:0;text-wrap:balance}
.top-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:500;line-height:1.2;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn-warn{background:var(--warm-soft);border-color:var(--warm);color:var(--warm);font-weight:600}
.btn kbd{font-family:var(--f-body);font-size:12px;border:1px solid currentColor;border-radius:6px;padding:0 6px;opacity:.7;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.qcard{padding:clamp(18px,2.8vw,36px);display:flex;flex-direction:column;gap:22px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.dots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.none{background:var(--surface-2);border-color:var(--ink-2);color:var(--ink-2)}
.dot.cur{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.done.cur{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--ink)}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:5px 12px}
.pts{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--warm);font-variant-numeric:tabular-nums}
.pts small{font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:.06em;margin-left:4px}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.7vw,46px);line-height:1.18;margin:0;text-wrap:balance;max-width:34ch}
.answer{border-radius:16px;background:var(--accent-soft);padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.answer .lab{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.answer .txt{font-family:var(--f-display);font-size:clamp(24px,2.8vw,34px);font-weight:600;line-height:1.2;margin:0}
.answer .ref{font-size:14px;color:var(--ink-2);margin:0}
.answer.hidden-ans{background:transparent;border:2px dashed var(--line);flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.answer.hidden-ans p{margin:0;color:var(--ink-2)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctl .spacer{flex:1 1 20px}
.teams-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3vw,34px);line-height:1.1;margin:0}
.hint{font-size:14px;color:var(--ink-2);margin:4px 0 0}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;width:min(100%,260px)}
.add input::placeholder{color:var(--ink-2);opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.tile.won{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow);background:var(--accent-soft)}
.trow{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:14px;height:14px;border-radius:50%;flex:none}
.tname{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;font-weight:600;font-size:18px;text-overflow:ellipsis}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--surface)}
.key{flex:none;font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:grid;place-items:center}
.x{flex:none;border:0;background:transparent;color:var(--ink-2);border-radius:8px;min-width:32px;height:32px;font-size:14px}
.x:hover{background:var(--surface-2);color:var(--warm)}
.x.arm{background:var(--warm-soft);color:var(--warm);font-weight:600;padding-inline:8px}
.score{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.num{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.95;font-variant-numeric:tabular-nums}
.num small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink-2);margin-left:6px;letter-spacing:.06em}
.rank{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 10px;white-space:nowrap}
.rank.first{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.give{width:100%;min-height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.give:hover{filter:brightness(1.08)}
.give.on{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.adj{display:flex;gap:8px}
.adj button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;min-height:36px;font-weight:600;color:var(--ink-2)}
.adj button:hover{background:var(--surface-2);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.results{padding:clamp(18px,2.8vw,36px);display:flex;flex-direction:column;gap:22px}
.rrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.rpos{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rrow.win .rpos{color:var(--accent)}
.rname{font-weight:600;font-size:20px;overflow-wrap:anywhere}
.rname .crown{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-left:8px}
.rscore{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.rrow .bar{grid-column:2 / 4;height:10px}
.foot{font-size:13px;color:var(--ink-2);margin:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px);z-index:5}
@media (max-width:520px){.num{font-size:52px}.btn{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
  var Q=[
    {tag:'Definición',pts:10,q:'¿Quién definió planear como «concebir un futuro deseado y los medios reales para conseguirlo»?',a:'Ackoff.',s:3},
    {tag:'Importancia',pts:10,q:'¿La planeación predice el futuro?',a:'No. Lo direcciona y reduce la incertidumbre.',s:4},
    {tag:'Identidad',pts:10,q:'¿Cómo se llama la parte axiológica de la organización, la de sus creencias, valores y normas?',a:'Los principios corporativos, que forman su cultura organizacional.',s:10},
    {tag:'Identidad',pts:10,q:'¿Cuál es la razón de ser de la organización, el «faro» que ilumina su camino?',a:'La misión.',s:11},
    {tag:'Diagnóstico',pts:15,q:'Las fortalezas y las debilidades, ¿son internas o externas? ¿Qué perfil las evalúa?',a:'Son internas. Las evalúa el PCI, perfil de capacidad interna.',s:12},
    {tag:'DOFA',pts:15,q:'¿Qué hace una estrategia FO?',a:'Usa las fortalezas para aprovechar las oportunidades.',s:13},
    {tag:'Estrategias',pts:15,q:'Una empresa compra a otra y deja que siga operando de forma independiente. ¿Qué estrategia ofensiva es?',a:'Una adquisición.',s:14},
    {tag:'Estrategias',pts:15,q:'Una fábrica de calzado decide producir su propia materia prima. ¿Qué estrategia es?',a:'Integración vertical hacia atrás.',s:14},
    {tag:'Diagnóstico',pts:20,q:'En el PCI, una debilidad tiene importancia 10 e impacto −5. ¿Cuánto da la evaluación ponderada y qué significa?',a:'−50: una debilidad de alto riesgo para la empresa.',s:12},
    {tag:'Mapa estratégico',pts:20,q:'¿Qué herramienta esquematiza todos los momentos del plan estratégico y sirve para divulgarlo?',a:'El mapa estratégico.',s:17}
  ];
  var COLORS=['#1B7F6A','#B85A18','#2F6FA8','#7A4F9E','#B23A5B','#6B7F1F','#3F5F7A','#A07A00'];
  var KEY='duelo-planeacion-v1';
  var MAXT=12;
  var shown={}, toastT=0, confirmReset=false, confirmTimer=0, armRemove=null, armTimer=0, focusAdd=false;

  function defaults(){
    return {teams:[{id:'t1',name:'Equipo 1',c:0},{id:'t2',name:'Equipo 2',c:1},{id:'t3',name:'Equipo 3',c:2}],awards:{},adj:{},q:0,view:'game',seq:3};
  }
  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(r){var o=JSON.parse(r); if(o&&Array.isArray(o.teams)&&o.awards&&o.adj){o.view='game'; if(typeof o.q!=='number'||o.q<0||o.q>=Q.length)o.q=0; if(typeof o.seq!=='number')o.seq=o.teams.length; return o;}}
    }catch(e){}
    return defaults();
  }
  var S=load();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function score(id){var s=S.adj[id]||0;for(var k in S.awards){if(S.awards[k]===id&&Q[+k])s+=Q[+k].pts;}return s;}
  function teamById(id){for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null;}
  function ranks(){
    var sc=S.teams.map(function(t){return score(t.id);});var out={};
    S.teams.forEach(function(t,i){var r=1;sc.forEach(function(x){if(x>sc[i])r++;});out[t.id]=r;});
    return out;
  }
  function resolvedCount(){var n=0;for(var k in S.awards)n++;return n;}
  function toast(msg){
    var el=document.getElementById('toast');el.textContent=msg;el.hidden=false;
    clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},2400);
  }

  function dotsHtml(){
    return Q.map(function(_,i){
      var a=S.awards[i],c='dot';
      if(a==='none')c+=' none';else if(a)c+=' done';
      if(i===S.q)c+=' cur';
      return '<button class="'+c+'" data-act="goto" data-i="'+i+'" aria-label="Ir a la pregunta '+(i+1)+'"'+(i===S.q?' aria-current="true"':'')+'>'+(i+1)+'</button>';
    }).join('');
  }

  function tileHtml(t,i,rk,max){
    var sc=score(t.id),won=S.awards[S.q]===t.id,q=Q[S.q];
    var pct=Math.max(0,Math.round(sc/max*100));
    var anyScore=S.teams.some(function(x){return score(x.id)!==0;});
    var rankTxt=anyScore?(rk[t.id]+'º lugar'):'Sin puntos';
    var color=COLORS[t.c%COLORS.length];
    return '<div class="tile'+(won?' won':'')+'">'+
      '<div class="trow"><span class="sw" style="background:'+color+'"></span>'+
      '<input class="tname" id="name-'+esc(t.id)+'" data-name="'+esc(t.id)+'" value="'+esc(t.name)+'" maxlength="30" aria-label="Nombre del equipo '+(i+1)+'">'+
      (i<9?'<span class="key" title="Tecla para dar puntos">'+(i+1)+'</span>':'')+
      '<button class="x'+(armRemove===t.id?' arm':'')+'" data-act="remove" data-id="'+esc(t.id)+'" aria-label="Quitar equipo">'+(armRemove===t.id?'¿Quitar?':'✕')+'</button></div>'+
      '<div class="score"><div class="num">'+sc+'<small>PTS</small></div><span class="rank'+(anyScore&&rk[t.id]===1?' first':'')+'">'+rankTxt+'</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div>'+
      '<button class="give'+(won?' on':'')+'" data-act="award" data-id="'+esc(t.id)+'">'+(won?'Ganó esta pregunta · quitar':'Dar '+q.pts+' puntos')+'</button>'+
      '<div class="adj"><button data-act="adj" data-id="'+esc(t.id)+'" data-d="-5" aria-label="Restar 5 puntos">−5</button><button data-act="adj" data-id="'+esc(t.id)+'" data-d="5" aria-label="Sumar 5 puntos">+5</button></div>'+
    '</div>';
  }

  function gameHtml(){
    var q=Q[S.q],aw=S.awards[S.q],solved=aw!==undefined,open=solved||shown[S.q];
    var rk=ranks(),max=Math.max(1,Math.max.apply(null,S.teams.map(function(t){return score(t.id);}).concat([1])));
    var winner=aw&&aw!=='none'?teamById(aw):null;
    var ans;
    if(open){
      ans='<div class="answer"><span class="lab">Respuesta</span><p class="txt">'+esc(q.a)+'</p><p class="ref">Para repasar: diapositiva '+q.s+'.'+
        (winner?' Ganó '+esc(winner.name)+' (+'+q.pts+').':(aw==='none'?' Nadie acertó.':''))+'</p></div>';
    }else{
      ans='<div class="answer hidden-ans"><p>La respuesta está oculta.</p><button class="btn" data-act="reveal">Mostrar respuesta <kbd>R</kbd></button></div>';
    }
    var teams=S.teams.length?
      '<div class="grid">'+S.teams.map(function(t,i){return tileHtml(t,i,rk,max);}).join('')+'</div>':
      '<div class="card empty">Todavía no hay equipos. Escribe un nombre arriba y presiona Agregar.</div>';
    var last=S.q===Q.length-1;
    return ''+
    '<header class="top"><div><p class="eyebrow">Planeación · Capítulo 3</p><h1>Duelo de Planeación</h1></div>'+
      '<div class="top-actions"><button class="btn" data-act="results">Ver resultados</button>'+
      '<button class="btn'+(confirmReset?' btn-warn':'')+'" data-act="reset">'+(confirmReset?'Confirmar: borrar puntos':'Nuevo juego')+'</button></div></header>'+
    '<section class="card qcard" aria-label="Pregunta actual">'+
      '<div class="qhead"><div class="meta"><span class="tag">Pregunta '+(S.q+1)+' de '+Q.length+' · '+esc(q.tag)+'</span><span class="pts">'+q.pts+'<small>PUNTOS</small></span></div>'+
      '<div class="dots">'+dotsHtml()+'</div></div>'+
      '<p class="qtext">'+esc(q.q)+'</p>'+ans+
      '<div class="ctl"><button class="btn" data-act="prev"'+(S.q===0?' disabled':'')+'>← Anterior</button>'+
      '<button class="btn" data-act="nobody">Nadie acertó <kbd>N</kbd></button><span class="spacer"></span>'+
      '<button class="btn btn-primary" data-act="next">'+(last?'Ver resultados':'Siguiente →')+'</button></div>'+
    '</section>'+
    '<section aria-label="Equipos"><div class="teams-head"><div><h2>Equipos</h2><p class="hint">Quien responda primero y bien: toca «Dar puntos» en su ficha o pulsa su número.</p></div>'+
      '<form class="add" id="add-form" autocomplete="off"><input id="new-team" placeholder="Nombre del equipo" maxlength="30" aria-label="Nombre del nuevo equipo"><button class="btn btn-primary" type="submit"'+(S.teams.length>=MAXT?' disabled':'')+'>Agregar equipo</button></form></div>'+
    '</section>'+teams+
    '<p class="foot"><span>Teclas: 1–9 dan puntos al equipo</span><span>R muestra la respuesta</span><span>N nadie acertó</span><span>← → cambian de pregunta</span><span>Los puntos se guardan en este navegador</span></p>';
  }

  function resultsHtml(){
    var list=S.teams.map(function(t){return {t:t,s:score(t.id)};}).sort(function(a,b){return b.s-a.s;});
    var max=Math.max(1,list.length?list[0].s:1),top=list.length?list[0].s:0;
    var total=0;Q.forEach(function(q){total+=q.pts;});
    var rows=list.length?list.map(function(r){
      var rank=1;list.forEach(function(x){if(x.s>r.s)rank++;});
      var win=r.s===top&&top>0;
      return '<div class="rrow'+(win?' win':'')+'"><span class="rpos">'+rank+'º</span>'+
        '<span class="rname"><span class="sw" style="display:inline-block;margin-right:8px;background:'+COLORS[r.t.c%COLORS.length]+'"></span>'+esc(r.t.name)+(win?'<span class="crown">Ganador</span>':'')+'</span>'+
        '<span class="rscore">'+r.s+'</span><div class="bar"><i style="width:'+Math.max(0,Math.round(r.s/max*100))+'%;background:'+COLORS[r.t.c%COLORS.length]+'"></i></div></div>';
    }).join(''):'<div class="empty">No hay equipos para mostrar.</div>';
    return ''+
    '<header class="top"><div><p class="eyebrow">Planeación · Capítulo 3</p><h1>Resultados</h1></div>'+
      '<div class="top-actions"><button class="btn btn-primary" data-act="back">Volver a las preguntas</button>'+
      '<button class="btn'+(confirmReset?' btn-warn':'')+'" data-act="reset">'+(confirmReset?'Confirmar: borrar puntos':'Nuevo juego')+'</button></div></header>'+
    '<section class="card results"><p class="hint" style="margin:0">'+resolvedCount()+' de '+Q.length+' preguntas jugadas · '+total+' puntos en juego</p>'+rows+'</section>';
  }

  function render(){
    document.getElementById('app').innerHTML=S.view==='results'?resultsHtml():gameHtml();
    if(focusAdd){focusAdd=false;var el=document.getElementById('new-team');if(el)el.focus();}
  }

  function award(id){
    var t=teamById(id);if(!t)return;
    if(S.awards[S.q]===id){delete S.awards[S.q];toast('Se quitaron los puntos de '+t.name);}
    else{S.awards[S.q]=id;shown[S.q]=true;toast(t.name+' suma '+Q[S.q].pts+' puntos');}
    save();render();
  }
  function nobody(){S.awards[S.q]='none';shown[S.q]=true;save();render();toast('Nadie acertó esta pregunta');}
  function next(){if(S.q<Q.length-1){S.q++;}else{S.view='results';}save();render();window.scrollTo(0,0);}
  function prev(){if(S.q>0){S.q--;save();render();}}
  function addTeam(name){
    if(S.teams.length>=MAXT)return;
    S.seq++;name=(name||'').trim()||('Equipo '+S.seq);
    S.teams.push({id:'t'+Date.now().toString(36)+S.seq,name:name,c:S.seq-1});
    save();focusAdd=true;render();
  }
  function removeTeam(id){
    if(armRemove!==id){armRemove=id;clearTimeout(armTimer);armTimer=setTimeout(function(){armRemove=null;render();},3000);render();return;}
    armRemove=null;S.teams=S.teams.filter(function(t){return t.id!==id;});
    for(var k in S.awards){if(S.awards[k]===id)delete S.awards[k];}
    delete S.adj[id];save();render();
  }
  function reset(){
    if(!confirmReset){confirmReset=true;clearTimeout(confirmTimer);confirmTimer=setTimeout(function(){confirmReset=false;render();},4000);render();return;}
    confirmReset=false;S.awards={};S.adj={};S.q=0;S.view='game';shown={};save();render();toast('Puntos reiniciados. Los equipos se conservan');
  }

  var app=document.getElementById('app');
  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
    if(a==='award')award(id);
    else if(a==='nobody')nobody();
    else if(a==='next')next();
    else if(a==='prev')prev();
    else if(a==='reveal'){shown[S.q]=true;render();}
    else if(a==='goto'){S.q=+b.getAttribute('data-i');save();render();}
    else if(a==='adj'){var d=+b.getAttribute('data-d');S.adj[id]=(S.adj[id]||0)+d;save();render();}
    else if(a==='remove')removeTeam(id);
    else if(a==='results'){S.view='results';render();}
    else if(a==='back'){S.view='game';render();}
    else if(a==='reset')reset();
  });
  app.addEventListener('submit',function(e){
    if(e.target.id==='add-form'){e.preventDefault();var inp=document.getElementById('new-team');addTeam(inp.value);}
  });
  app.addEventListener('input',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-name');
    if(id){var t=teamById(id);if(t){t.name=e.target.value;save();}}
  });
  document.addEventListener('keydown',function(e){
    var tg=e.target&&e.target.tagName;
    if(tg==='INPUT'||tg==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
    if(S.view!=='game')return;
    var k=e.key;
    if(k>='1'&&k<='9'){var t=S.teams[+k-1];if(t)award(t.id);}
    else if(k==='r'||k==='R'){shown[S.q]=true;render();}
    else if(k==='n'||k==='N'){nobody();}
    else if(k==='ArrowRight'){next();}
    else if(k==='ArrowLeft'){prev();}
  });

  render();
})();
</script>

</body>
</html>
